<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>长颈鹿的课表🦒</title><link rel="stylesheet" href="schedule.css"></head><body>
<div class="shell"><header><div><small>TRAINLOG SCHEDULE</small><h1>长颈鹿的课表🦒</h1></div><div class="actions"><button id="memberBtn" class="secondary">＋ 会员</button><button id="addBtn">＋ 排课</button></div></header><section id="status" class="notice"></section><main id="app"></main></div>
<dialog id="courseDialog"><form method="dialog" id="courseForm"><h2 id="courseTitle">安排课程</h2><input type="hidden" id="courseId">
<label>约课类型<select id="appointmentType"><option value="regular">常规约课</option><option value="trial">首次体验</option></select></label>
<div id="scheduleKindField"><label>排课方式<select id="kind"><option value="fixed">固定课 · 每周重复</option><option value="temporary">临时约课 · 仅此日期</option></select></label></div>
<div id="regularStudentFields"><label>筛选会员<input id="studentSearch" placeholder="输入姓名快速筛选"></label><label>会员<select id="studentName"></select></label></div>
<div id="trialStudentField"><label>体验会员姓名<input id="trialName" placeholder="直接输入姓名，无需先创建会员"></label><label>年龄<input id="trialAge" type="number" min="0" max="120" placeholder="如：10"></label><label>会员需求<textarea id="trialMemberNeed" rows="2" placeholder="孩子本人想练什么、喜欢什么、希望达到什么"></textarea></label><label>家长需求<textarea id="trialParentNeed" rows="2" placeholder="家长最关注：减脂 / 增高 / 体态 / 体能 / 专项等"></textarea></label><label>体验备注<textarea id="trialNotes" rows="2" placeholder="伤病、注意事项、其他补充"></textarea></label><small>首次体验按单次课程处理；年龄与需求会同步到 App 体验会员资料。</small></div>
<div id="fixedField"><label>固定星期<select id="weekday"></select></label></div>
<div id="tempField"><label>约课日期<input id="courseDate" type="date"></label></div>
<div class="two"><label>开始时间<input id="startTime" type="time" required value="16:00"></label><label>结束时间<input id="endTime" type="time" required value="17:00"></label></div>
<div id="regularCourseTypeField"><label>课程类型<select id="courseType"><option>力量</option><option>有氧</option><option>速度</option><option>灵敏协调</option><option>爆发</option><option>增高</option><option>减脂</option><option>体态纠正</option><option>专项</option><option>综合</option><option>其它</option></select></label></div>
<label>备注<input id="notes" placeholder="接送 / 团课 / 调课原因等"></label>
<div class="dialog-actions"><button type="button" id="deleteBtn" class="danger hidden">删除</button><span class="spacer"></span><button type="button" class="secondary" id="cancelCourse">取消</button><button type="submit" id="saveCourseBtn">保存</button></div></form></dialog>
<dialog id="memberDialog"><form method="dialog" id="memberForm"><h2 id="memberTitle">创建会员</h2><input type="hidden" id="memberId"><label>会员编号<input id="memberCode" value="保存后自动生成6位编号" readonly></label><label>姓名<input id="memberName" placeholder="姓名与英文名/小名至少填一项"></label><label>英文名/小名<input id="memberAlias" placeholder="如：Eason / 乐乐"></label><div class="two"><label>性别<select id="memberSex"><option value="">未填写</option><option>男</option><option>女</option></select></label><label>年龄<input id="memberAge" type="number" min="0" max="120" placeholder="输入年龄"></label></div><label>出生日期<input id="memberBirth" type="date"></label><label>训练目标<input id="memberGoal" placeholder="减脂 / 增高 / 体态 / 专项"></label><label>联系方式<input id="memberContact"></label><label>备注<input id="memberNotes"></label><div class="dialog-actions"><button type="button" id="deleteMemberBtn" class="danger hidden">删除会员</button><span class="spacer"></span><button type="button" class="secondary" id="cancelMember">取消</button><button type="submit">保存会员</button></div></form></dialog>
<dialog id="contentDialog"><div class="readonly-dialog"><h2 id="contentTitle">课程内容</h2><div id="contentBody"></div><div class="dialog-actions"><span class="spacer"></span><button type="button" class="secondary" id="closeContent">关闭</button></div></div></dialog>
<script src="cloud-schedule.js"></script><script src="schedule.js"></script></body></html>
