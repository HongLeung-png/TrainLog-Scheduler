<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrainLog 网页排课</title><link rel="stylesheet" href="schedule.css"></head><body>
<div class="shell"><header><div><small>TRAINLOG SCHEDULE</small><h1>共享课表</h1></div><div class="actions"><button id="settingsBtn" class="secondary">连接设置</button><button id="addBtn">＋ 排课</button></div></header>
<section id="status" class="notice"></section><main id="app"></main></div>
<dialog id="loginDialog"><form method="dialog" id="loginForm"><h2>连接共享课表</h2><label>Supabase Project URL<input id="url" required placeholder="https://xxxx.supabase.co"></label><label>Publishable Key<input id="key" required placeholder="sb_publishable_..."></label><label>邮箱<input id="email" type="email" required></label><label>密码<input id="password" type="password" placeholder="仅本次登录使用"></label><div class="dialog-actions"><button type="button" class="secondary" id="cancelLogin">取消</button><button type="submit">保存并登录</button></div></form></dialog>
<dialog id="courseDialog"><form method="dialog" id="courseForm"><h2 id="courseTitle">安排课程</h2><input type="hidden" id="courseId"><label>排课方式<select id="kind"><option value="fixed">固定课 · 每周重复</option><option value="temporary">临时约课 · 仅此日期</option></select></label><label>学员姓名<input id="studentName" list="studentNames" required><datalist id="studentNames"></datalist></label><div id="fixedField"><label>固定星期<select id="weekday"></select></label></div><div id="tempField"><label>约课日期<input id="courseDate" type="date"></label></div><div class="two"><label>开始时间<input id="startTime" type="time" required value="16:00"></label><label>结束时间<input id="endTime" type="time" required value="17:00"></label></div><label>课程类型<select id="courseType"><option>力量</option><option>有氧</option><option>速度</option><option>灵敏协调</option><option>体态纠正</option><option>专项</option><option>综合</option></select></label><label>备注<input id="notes" placeholder="家长接送 / 团课 / 调课原因等"></label><div class="dialog-actions"><button type="button" id="deleteBtn" class="danger hidden">删除</button><span class="spacer"></span><button type="button" class="secondary" id="cancelCourse">取消</button><button type="submit">保存</button></div></form></dialog>
<script src="cloud-schedule.js"></script><script src="schedule.js"></script></body></html>
